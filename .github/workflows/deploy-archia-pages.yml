name: Deploy ArchIA portal to GitHub Pages

on:
  push:
    branches:
      - claude/archia-portal-build-2zckr6
    paths:
      - "web/archia/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/archia
      - id: deployment
        uses: actions/deploy-pages@v4
