version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "eu-west-1"
    ECR_REPO: "valhalla"
    IMAGE_TAG: "latest"

phases:
  pre_build:
    commands:
      - |
        echo "== Pre-build =="
        cd valhalla-on-aws
        echo "PWD (pre_build): $(pwd)"
        ls -la
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        ECR_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}"
        echo "ECR_URI=${ECR_URI}"
        # Crea repo ECR si no existe (idempotente)
        aws ecr describe-repositories --repository-names "${ECR_REPO}" \
          || aws ecr create-repository --repository-name "${ECR_REPO}"
        # Login ECR
        aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" \
          | docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

  build:
    commands:
      - |
        echo "== Build =="
        cd valhalla-on-aws
        echo "PWD (build): $(pwd)"
        ls -la
        docker version
        # Construye usando el Dockerfile de esta carpeta
        docker build -t "${ECR_REPO}:${IMAGE_TAG}" -f Dockerfile .
        docker tag "${ECR_REPO}:${IMAGE_TAG}" "${ECR_URI}:${IMAGE_TAG}"

  post_build:
    commands:
      - |
        echo "== Push =="
        cd valhalla-on-aws
        echo "PWD (post_build): $(pwd)"
        docker push "${ECR_URI}:${IMAGE_TAG}"
        printf '[{"name":"valhalla","imageUri":"%s"}]' "${ECR_URI}:${IMAGE_TAG}" > imagedefinitions.json
        echo "Listo: ${ECR_URI}:${IMAGE_TAG}"

artifacts:
  files:
    - valhalla-on-aws/imagedefinitions.json
