<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ArchIA – Acceso</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0c10;color:#e8f0fe;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif}
  .card{background:#11131a;border:1px solid #1b2131;border-radius:12px;padding:28px;width:100%;max-width:380px}
  .logo{font-size:26px;font-weight:700;margin-bottom:4px}
  .logo span{color:#3b82f6}
  .sub{color:#9fb3c8;font-size:13px;margin-bottom:20px}
  label{font-size:13px;color:#9fb3c8;display:block;margin-top:12px}
  input,button{width:100%;padding:10px;margin-top:6px;border-radius:10px;border:1px solid #243247;background:#0f1320;color:#e8f0fe;box-sizing:border-box}
  button{cursor:pointer;background:#3b82f6;border-color:#215ab6;font-weight:600;margin-top:18px}
  button:disabled{opacity:.6;cursor:not-allowed}
  .err{color:#ff8989;font-size:13px;margin-top:10px;display:none}
  details{margin-top:18px}
  summary{cursor:pointer;color:#9fb3c8;font-size:12px}
  .apiRow{margin-top:8px}
  .note{font-size:12px;color:#9fb3c8;margin-top:6px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Arch<span>IA</span></div>
    <div class="sub">Recomendaciones de seguridad asistidas por agentes</div>

    <form id="loginForm">
      <label>Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required/>
      <button type="submit" id="btnLogin">Entrar</button>
      <div class="err" id="err"></div>
    </form>

    <details>
      <summary>Configuración avanzada</summary>
      <div class="apiRow">
        <label>API Base URL</label>
        <input id="apiBase" placeholder="https://tu-api.example.com"/>
        <label>Token de la API (cuando esté disponible)</label>
        <input id="apiToken" placeholder="Bearer token"/>
      </div>
      <p class="note">
        Mientras no haya token de API configurado, el acceso se valida solo con la contraseña.
      </p>
    </details>
  </div>

  <script src="archia.js"></script>
  <script>
    ArchIA.initLoginPage();
  </script>
</body>
</html>
