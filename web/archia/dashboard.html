<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ArchIA – Panel</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#0b0c10;color:#e8f0fe;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif}
  header{padding:16px 20px;border-bottom:1px solid #1b2131;background:#0d1017;display:flex;align-items:center;gap:14px}
  .logo{font-weight:700;font-size:18px}
  .logo span{color:#3b82f6}
  .userbox{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:#9fb3c8}
  button{cursor:pointer;background:#3b82f6;border-color:#215ab6;color:#e8f0fe;border:1px solid #243247;border-radius:10px;padding:8px 12px;font-weight:600}
  button.ghost{background:#0f1320}
  button.danger{background:#e55353;border-color:#9c2f2f}
  button:disabled{opacity:.6;cursor:not-allowed}
  main{display:grid;grid-template-columns:420px 1fr;gap:16px;padding:16px}
  @media(max-width:1000px){main{grid-template-columns:1fr}}
  .card{background:#11131a;border:1px solid #1b2131;border-radius:12px;padding:16px;margin-bottom:16px}
  h2{margin:0 0 10px;font-size:16px}
  label{font-size:13px;color:#9fb3c8;display:block;margin-top:8px}
  input,select,textarea{width:100%;padding:9px;margin-top:6px;border-radius:8px;border:1px solid #243247;background:#0f1320;color:#e8f0fe;box-sizing:border-box}
  .drop{margin-top:10px;border:2px dashed #243247;border-radius:10px;padding:24px;text-align:center;color:#9fb3c8;font-size:13px}
  .drop.over{border-color:#3b82f6;background:#0f1320}
  ul.files{list-style:none;margin:10px 0 0;padding:0}
  ul.files li{display:flex;justify-content:space-between;align-items:center;background:#0f1320;border:1px solid #243247;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:13px}
  ul.files li .rm{cursor:pointer;color:#ff8989;font-size:12px}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;border:1px solid #243247;background:#0f1320;font-size:12px}
  .status-queued{color:#f0ad4e}
  .status-running{color:#3b82f6}
  .status-done{color:#25a244}
  .status-error{color:#e55353}
  progress{width:100%;height:10px;border-radius:8px;margin-top:8px}
  .rec{border:1px solid #243247;border-radius:10px;padding:12px;margin-top:10px;background:#0f1320}
  .rec h3{margin:0 0 4px;font-size:14px}
  .sev{font-size:11px;padding:2px 8px;border-radius:999px;margin-left:8px}
  .sev-critica{background:#5c1414;color:#ff8989}
  .sev-alta{background:#5c3414;color:#ffc089}
  .sev-media{background:#5c4f14;color:#fff089}
  .sev-baja{background:#143b1e;color:#8dffa6}
  .rec p{font-size:13px;color:#cdd9e6;margin:6px 0 0}
  .muted{color:#9fb3c8;font-size:12px}
  textarea#summaryEdit{height:90px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
</style>
</head>
<body>
  <header>
    <div class="logo">Arch<span>IA</span></div>
    <span class="pill" id="demoPill" style="display:none">Modo demo</span>
    <div class="userbox">
      <span id="userEmail"></span>
      <button class="ghost" id="btnLogout">Salir</button>
    </div>
  </header>

  <main>
    <div>
      <div class="card">
        <h2>1. Cargar ficheros</h2>
        <label>Nombre del proyecto / análisis</label>
        <input id="projectName" placeholder="Ej. Auditoría arquitectura cliente X"/>

        <div class="drop" id="dropZone">
          Arrastra aquí PDF, Word, Excel, imágenes… o
          <button type="button" class="ghost" id="btnPick" style="margin-top:8px">Seleccionar ficheros</button>
          <input type="file" id="fileInput" multiple style="display:none"
                 accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.png,.jpg,.jpeg,.json,.xml,.yaml,.yml"/>
        </div>
        <ul class="files" id="fileList"></ul>

        <div class="toolbar">
          <button id="btnAnalyze" disabled>Enviar a los agentes</button>
        </div>
        <p class="muted" id="jobStatus"></p>
        <progress id="jobProgress" max="100" value="0" style="display:none"></progress>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>2. Recomendaciones de seguridad</h2>
        <div id="recsEmpty" class="muted">Aún no hay recomendaciones. Carga ficheros y lanza el análisis.</div>
        <div id="recsList"></div>
      </div>

      <div class="card" id="reportCard" style="display:none">
        <h2>3. Generar entregable</h2>
        <label>Plantilla</label>
        <select id="templateSelect">
          <option value="default">Informe de recomendaciones de seguridad (estándar)</option>
        </select>
        <label>Resumen ejecutivo (editable)</label>
        <textarea id="summaryEdit"></textarea>
        <div class="toolbar">
          <button id="btnPreview" class="ghost">Vista previa</button>
          <button id="btnGenerateReport">Generar entregable</button>
        </div>
        <p class="muted" id="reportStatus"></p>
      </div>
    </div>
  </main>

  <script src="archia.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
