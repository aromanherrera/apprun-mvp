<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ArchIA – Panel</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:#0a0f0a;color:#e0f0e0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif}
  header{padding:16px 24px;border-bottom:1px solid #1a2e1a;background:#0c120c;display:flex;align-items:center;gap:14px}
  .logo{font-weight:700;font-size:20px;letter-spacing:-.5px}
  .logo span{color:#22c55e}
  main{max-width:860px;margin:0 auto;padding:28px 20px;display:flex;flex-direction:column;gap:20px}

  /* Cards */
  .card{background:#0e180e;border:1px solid #1a2e1a;border-radius:14px;padding:24px}
  .card-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4ade80;margin:0 0 18px}

  /* Drop zone */
  .drop{border:2px dashed #1e3a1e;border-radius:10px;padding:36px 24px;text-align:center;color:#6b9e6b;font-size:14px;cursor:pointer;transition:border-color .15s,background .15s}
  .drop:hover,.drop.over{border-color:#22c55e;background:#071007;color:#b0d8b0}
  .drop input[type=file]{display:none}
  .drop-icon{font-size:32px;display:block;margin-bottom:10px}
  .drop-hint{font-size:12px;color:#4a7a4a;margin-top:6px}

  /* Selected file */
  #fileInfo{display:none;margin-top:14px;background:#071007;border:1px solid #1e3a1e;border-radius:8px;padding:12px 14px;font-size:13px;display:none;align-items:center;gap:10px}
  #fileInfo .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #fileInfo .fremove{cursor:pointer;color:#f87171;font-size:12px;flex-shrink:0}

  /* Upload status */
  #uploadStatus{margin-top:14px;font-size:13px;display:none;align-items:center;gap:10px}
  .spinner{width:18px;height:18px;border:2px solid #1e3a1e;border-top-color:#22c55e;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .check{width:18px;height:18px;background:#22c55e;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px}
  .x-icon{width:18px;height:18px;background:#ef4444;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px}
  .status-text{color:#b0ccb0}
  .status-text.ok{color:#4ade80;font-weight:600}
  .status-text.err{color:#f87171}

  /* Playbook button */
  #btnPlaybook{width:100%;padding:18px;font-size:16px;font-weight:700;border-radius:12px;border:none;cursor:pointer;background:#166534;color:#e0f0e0;letter-spacing:.02em;transition:background .15s,opacity .15s}
  #btnPlaybook:hover:not(:disabled){background:#15803d}
  #btnPlaybook:disabled{background:#1a2e1a;color:#4a6a4a;cursor:not-allowed;opacity:1}

  /* Result area */
  #resultCard{display:none}
  #resultBox{background:#071007;border:1px solid #1e3a1e;border-radius:8px;padding:16px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow-y:auto;color:#b0ccb0}
  .result-running{display:flex;align-items:center;gap:10px;color:#6b9e6b;font-size:13px}

  button.ghost{cursor:pointer;background:#0e180e;border:1px solid #1a2e1a;color:#8db88d;border-radius:8px;padding:7px 14px;font-size:13px}
  button.ghost:hover{background:#162616}

  /* Error console */
  #errorPanel{max-width:860px;margin:0 auto 0;padding:0 20px 28px}
  #errorPanel details{background:#0a0f0a;border:1px solid #3a1a1a;border-radius:10px;padding:0}
  #errorPanel summary{padding:10px 14px;font-size:12px;font-weight:700;color:#f87171;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;user-select:none}
  #errorEntries{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto}
  .err-entry{font-size:11px;font-family:monospace;background:#1a0808;border:1px solid #3a1a1a;border-radius:6px;padding:8px 10px}
  .err-entry .err-time{color:#6b4a4a;margin-right:8px}
  .err-entry .err-type{font-weight:700;color:#f87171;margin-right:6px}
  .err-entry .err-msg{color:#fca5a5;word-break:break-all;white-space:pre-wrap}
  .err-entry .err-stack{color:#7a4444;margin-top:4px;white-space:pre-wrap;font-size:10px;max-height:80px;overflow-y:auto}
  #btnClearErrors{float:right;margin-top:-2px;font-size:11px;background:transparent;border:none;color:#6b4a4a;cursor:pointer;padding:2px 6px}
  #btnClearErrors:hover{color:#f87171}
  #errorBadge{display:none;background:#ef4444;color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;margin-left:6px;font-weight:700}
</style>
</head>
<body>
<header>
  <div class="logo">Arch<span>IA</span></div>
</header>

<main>
  <!-- STEP 1: FILE UPLOAD -->
  <div class="card">
    <div class="card-title">1 · Subir documento</div>
    <div style="margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <button class="ghost" id="btnTestConn" style="font-size:12px;padding:5px 12px">&#128268; Probar conexión API</button>
      <span id="connResult" style="font-size:12px;color:#6b9e6b"></span>
    </div>

    <div class="drop" id="dropZone">
      <span class="drop-icon">&#128196;</span>
      Arrastra aquí tu fichero o haz clic para seleccionar
      <div class="drop-hint">Formatos admitidos: .doc, .docx, .pdf</div>
      <input type="file" id="fileInput" accept=".doc,.docx,.pdf"/>
    </div>

    <div id="fileInfo" style="display:none">
      <span style="font-size:18px">&#128196;</span>
      <span class="fname" id="fileName"></span>
      <span class="fremove" id="btnRemove">&#10005; Quitar</span>
    </div>

    <div id="uploadStatus" style="display:none"></div>
  </div>

  <!-- STEP 2: PLAYBOOK -->
  <div class="card">
    <div class="card-title">2 · Ejecutar análisis de arquitectura</div>
    <button id="btnPlaybook" disabled>&#9654;&nbsp; Ejecutar Playbook</button>
    <div id="playbookStatus" style="margin-top:12px;font-size:13px;color:#6b9e6b;min-height:20px"></div>
  </div>

  <!-- STEP 3: RESULT -->
  <div class="card" id="resultCard" style="display:none">
    <div class="card-title" style="margin-bottom:14px">3 · Resultado</div>
    <div id="resultBox"></div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="ghost" id="btnCopy">&#128203; Copiar</button>
      <button class="ghost" id="btnReset">&#8635; Nuevo análisis</button>
    </div>
  </div>
</main>


<div id="logPanel">
  <details open>
    <summary>&#128270; Log de llamadas API <button id="btnClearLog" onclick="event.stopPropagation();document.getElementById('logEntries').innerHTML=''">Limpiar</button></summary>
    <div id="logEntries"></div>
  </details>
</div>

<div id="errorPanel">
  <details id="errorDetails">
    <summary>&#9888; Consola de errores <span id="errorBadge">0</span>
      <button id="btnClearErrors" onclick="event.stopPropagation();document.getElementById('errorEntries').innerHTML='';document.getElementById('errorBadge').style.display='none';document.getElementById('errorBadge').textContent='0'">Limpiar</button>
    </summary>
    <div id="errorEntries"><span style="color:#4a3030;font-size:11px;font-family:monospace;padding:4px 0;display:block">Sin errores registrados.</span></div>
  </details>
</div>

<script>
if (location.protocol === 'file:') {
  document.body.insertAdjacentHTML('afterbegin',
    '<div style="background:#7f1d1d;color:#fca5a5;padding:14px 20px;font-size:13px;font-family:monospace;text-align:center">' +
    '&#9888; Estás abriendo el fichero directamente. Debes usar el servidor local:<br>' +
    '<strong>cd apprun-mvp/web/archia &amp;&amp; python3 server.py</strong> &nbsp;→&nbsp; abre <strong>http://localhost:8080</strong>' +
    '</div>'
  );
}
</script>
<script src="dashboard.js"></script>
</body>
</html>
