<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ArchIA – Histórico</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:#0a0f0a;color:#e0f0e0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:14px 24px;border-bottom:1px solid #1a2e1a;background:#0c120c;display:flex;align-items:center;gap:16px}
  .logo{font-weight:700;font-size:19px}.logo span{color:#22c55e}
  nav{display:flex;gap:6px;margin-left:auto}
  nav a{color:#8db88d;font-size:13px;text-decoration:none;padding:5px 12px;border-radius:8px;border:1px solid transparent}
  nav a:hover{background:#0e180e;border-color:#1a2e1a;color:#4ade80}
  nav a.active{color:#4ade80;border-color:#1a2e1a;background:#0e180e}
  main{max-width:1100px;margin:0 auto;padding:28px 20px}
  h1{font-size:18px;margin:0 0 20px;color:#4ade80}
  .card{background:#0e180e;border:1px solid #1a2e1a;border-radius:14px;padding:20px;margin-bottom:20px}

  /* Table */
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead tr{border-bottom:2px solid #1e3a1e}
  thead th{padding:10px 12px;text-align:left;color:#4ade80;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
  tbody tr{border-bottom:1px solid #0f1f0f;transition:background .1s}
  tbody tr:hover{background:#0f1a0f}
  tbody td{padding:10px 12px;vertical-align:middle;color:#c0d8c0}
  .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700}
  .badge-completed{background:#052e16;color:#4ade80;border:1px solid #166534}
  .badge-working{background:#1c2a0a;color:#a3e635;border:1px solid #365314}
  .badge-failed{background:#1a0808;color:#f87171;border:1px solid #7f1d1d}
  .badge-unknown{background:#1a1a1a;color:#9ca3af;border:1px solid #374151}
  .btn-detail{cursor:pointer;background:transparent;border:1px solid #166534;color:#4ade80;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600;white-space:nowrap}
  .btn-detail:hover{background:#052e16}
  .btn-detail.active{background:#166534;color:#e0f0e0}
  .id-cell{font-family:monospace;font-size:11px;color:#6b9e6b;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .loading{color:#6b9e6b;font-size:13px;display:flex;align-items:center;gap:8px;padding:8px 0}
  .spinner{width:16px;height:16px;border:2px solid #1e3a1e;border-top-color:#22c55e;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty{color:#4a7a4a;font-size:13px;padding:20px 0;text-align:center}

  /* Detail panel */
  #detailPanel{display:none}
  #detailPanel .detail-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  #detailPanel .detail-id{font-family:monospace;font-size:11px;color:#6b9e6b}
  #detailClose{cursor:pointer;margin-left:auto;background:transparent;border:1px solid #1a2e1a;color:#8db88d;border-radius:8px;padding:4px 10px;font-size:12px}
  #detailClose:hover{border-color:#f87171;color:#f87171}
  #detailContent{font-size:13px;line-height:1.7;color:#c0d8c0;max-height:600px;overflow-y:auto}

  /* Rendered markdown */
  #detailContent h1,#detailContent h2,#detailContent h3{color:#4ade80;margin:16px 0 6px}
  #detailContent h1{font-size:17px}#detailContent h2{font-size:15px}#detailContent h3{font-size:14px}
  #detailContent p{margin:6px 0}
  #detailContent strong{color:#e0f0e0}
  #detailContent ul,#detailContent ol{margin:6px 0;padding-left:20px}
  #detailContent li{margin:3px 0}
  #detailContent table{width:100%;border-collapse:collapse;margin:12px 0;font-size:12px}
  #detailContent th{background:#071007;color:#4ade80;padding:8px 10px;text-align:left;border:1px solid #1e3a1e;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  #detailContent td{padding:8px 10px;border:1px solid #0f1f0f;vertical-align:top;color:#c0d8c0}
  #detailContent tr:nth-child(even) td{background:#071007}
  #detailContent code{background:#071007;padding:1px 5px;border-radius:4px;font-family:monospace;font-size:12px;color:#4ade80}
  #detailContent hr{border:none;border-top:1px solid #1a2e1a;margin:14px 0}

  /* Log panel */
  #logPanel{max-width:1100px;margin:0 auto 12px;padding:0 20px}
  #logPanel details{background:#0a0f0a;border:1px solid #1a2e1a;border-radius:10px;padding:0}
  #logPanel summary{padding:10px 14px;font-size:12px;font-weight:700;color:#4ade80;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;user-select:none}
  #logEntries{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;max-height:380px;overflow-y:auto}
  .log-entry{font-size:11px;font-family:monospace;border-radius:6px;overflow:hidden}
  .log-entry .log-head{padding:6px 10px;display:flex;gap:8px;align-items:baseline}
  .log-entry .log-method{font-weight:700}
  .log-entry .log-url{color:#86efac;word-break:break-all}
  .log-entry .log-time{margin-left:auto;color:#4a7a4a;white-space:nowrap}
  .log-entry .log-body{padding:6px 10px;border-top:1px solid rgba(255,255,255,.06);white-space:pre-wrap;word-break:break-all;line-height:1.5;color:#a0c8a0;max-height:200px;overflow-y:auto}
  .log-req{background:#071207}
  .log-res-ok{background:#052e16}
  .log-res-err{background:#1a0808}
  .log-res-err .log-url{color:#f87171}
  .log-net-err{background:#1a0808}
  .log-net-err .log-url{color:#f87171}
  #btnClearLog{float:right;margin-top:-2px;font-size:11px;background:transparent;border:none;color:#4a7a4a;cursor:pointer;padding:2px 6px}
  #btnClearLog:hover{color:#f87171}

  /* Error console */
  #errorPanel{max-width:1100px;margin:0 auto 28px;padding:0 20px}
  #errorPanel details{background:#0a0f0a;border:1px solid #3a1a1a;border-radius:10px;padding:0}
  #errorPanel summary{padding:10px 14px;font-size:12px;font-weight:700;color:#f87171;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;user-select:none}
  #errorEntries{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto}
  .err-entry{font-size:11px;font-family:monospace;background:#1a0808;border:1px solid #3a1a1a;border-radius:6px;padding:8px 10px}
  .err-entry .err-time{color:#6b4a4a;margin-right:8px}
  .err-entry .err-type{font-weight:700;color:#f87171;margin-right:6px}
  .err-entry .err-msg{color:#fca5a5;word-break:break-all;white-space:pre-wrap}
  .err-entry .err-stack{color:#7a4444;margin-top:4px;white-space:pre-wrap;font-size:10px;max-height:80px;overflow-y:auto}
  #btnClearErrors{float:right;margin-top:-2px;font-size:11px;background:transparent;border:none;color:#6b4a4a;cursor:pointer;padding:2px 6px}
  #btnClearErrors:hover{color:#f87171}
  #errorBadge{display:none;background:#ef4444;color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;margin-left:6px;font-weight:700}
</style>
</head>
<body>
<header>
  <div class="logo">Arch<span>IA</span></div>
  <nav>
    <a href="dashboard.html">Panel</a>
    <a href="historico.html" class="active">Histórico</a>
  </nav>
</header>

<main>
  <h1>Histórico de ejecuciones</h1>

  <div class="card">
    <div id="tableWrap">
      <div class="loading"><div class="spinner"></div> Cargando ejecuciones…</div>
    </div>
  </div>

  <div class="card" id="detailPanel">
    <div class="detail-header">
      <strong style="color:#4ade80;font-size:14px">Detalle de ejecución</strong>
      <span class="detail-id" id="detailId"></span>
      <button id="detailClose" onclick="closeDetail()">✕ Cerrar</button>
    </div>
    <div id="detailContent"><div class="loading"><div class="spinner"></div> Cargando…</div></div>
  </div>
</main>

<div id="logPanel">
  <details open>
    <summary>&#128270; Log de llamadas API <button id="btnClearLog" onclick="event.stopPropagation();document.getElementById('logEntries').innerHTML=''">Limpiar</button></summary>
    <div id="logEntries"></div>
  </details>
</div>

<div id="errorPanel">
  <details id="errorDetails">
    <summary>&#9888; Consola de errores <span id="errorBadge">0</span>
      <button id="btnClearErrors" onclick="event.stopPropagation();document.getElementById('errorEntries').innerHTML='';document.getElementById('errorBadge').style.display='none';document.getElementById('errorBadge').textContent='0'">Limpiar</button>
    </summary>
    <div id="errorEntries"><span style="color:#4a3030;font-size:11px;font-family:monospace;padding:4px 0;display:block">Sin errores registrados.</span></div>
  </details>
</div>

<script>
  // ---- Global error console ----
  (function() {
    var count = 0;
    function addError(type, msg, stack, extra) {
      var entries = document.getElementById('errorEntries');
      if (!entries) return;
      var placeholder = entries.querySelector('span');
      if (placeholder) placeholder.remove();
      count++;
      var badge = document.getElementById('errorBadge');
      if (badge) { badge.textContent = count; badge.style.display = 'inline'; }
      var details = document.getElementById('errorDetails');
      if (details) details.open = true;
      var time = new Date().toLocaleTimeString('es-ES', {hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
      var div = document.createElement('div');
      div.className = 'err-entry';
      var html = '<span class="err-time">'+time+'</span><span class="err-type">'+esc(type)+'</span><span class="err-msg">'+esc(msg)+'</span>';
      if (extra) html += '<div class="err-stack">'+esc(extra)+'</div>';
      if (stack && stack !== msg) html += '<div class="err-stack">'+esc(stack)+'</div>';
      div.innerHTML = html;
      entries.appendChild(div);
    }
    function esc(s){return(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
    window.addEventListener('error', function(e) {
      var loc = (e.filename ? e.filename.replace(/.*\//,'') : '') + (e.lineno ? ':'+e.lineno : '');
      addError('JS ERROR', e.message, e.error && e.error.stack, loc || undefined);
    });
    window.addEventListener('unhandledrejection', function(e) {
      var reason = e.reason;
      var msg = reason instanceof Error ? reason.message : String(reason);
      addError('PROMISE', msg, reason instanceof Error ? reason.stack : undefined);
    });
    window.__logError = addError;
  })();

  var API_BASE  = "https://api1-soarplus-pre.es.deloitte.com";
  var API_TOKEN = "sk-UmL4haDNvWZdQ4a8ZxKb3Q";

  function authHeaders(extra) {
    return Object.assign({ "Authorization": "Bearer " + API_TOKEN }, extra || {});
  }

  // ---- API Logger ----
  function log(type, data) {
    var entries = document.getElementById("logEntries");
    if (!entries) return;
    var div = document.createElement("div");
    div.className = "log-entry " + type;
    var time = new Date().toLocaleTimeString("es-ES", {hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"});
    var headHtml = "", bodyHtml = "";
    if (type === "log-req") {
      headHtml = '<span class="log-method">'+esc(data.method)+'</span><span class="log-url">'+esc(data.url)+'</span><span class="log-time">'+time+'</span>';
      var parts = [];
      if (data.headers) parts.push("Headers: " + JSON.stringify(data.headers, null, 2));
      if (data.body) parts.push("Body: " + data.body);
      bodyHtml = parts.join("\n\n");
    } else {
      var status = data.status ? " HTTP " + data.status : "";
      headHtml = '<span class="log-method">'+esc(data.label||"RESPONSE")+'</span><span class="log-url">'+esc(status)+' '+esc(data.url||"")+'</span><span class="log-time">'+(data.ms ? data.ms+"ms · " : "")+time+'</span>';
      bodyHtml = data.body || data.error || "";
    }
    div.innerHTML = '<div class="log-head">'+headHtml+'</div>'+(bodyHtml ? '<div class="log-body">'+esc(bodyHtml)+'</div>' : "");
    entries.appendChild(div);
    entries.scrollTop = entries.scrollHeight;
  }

  async function apiFetch(url, options) {
    options = options || {};
    var method = (options.method || "GET").toUpperCase();
    var headers = options.headers || {};
    log("log-req", { method: method, url: url, headers: headers, body: options.body ? JSON.stringify(options.body) : "" });
    var t0 = Date.now();
    try {
      var res = await fetch(url, options);
      var ms = Date.now() - t0;
      var bodyText = await res.text();
      log(res.ok ? "log-res-ok" : "log-res-err", { label: res.ok ? "OK" : "ERROR", url: url, status: res.status, ms: ms, body: bodyText.slice(0, 3000) });
      return { ok: res.ok, status: res.status, text: bodyText };
    } catch(e) {
      var ms2 = Date.now() - t0;
      var hint = e instanceof TypeError ? "\n\nPosible causa: CORS — abre Chrome con --disable-web-security o usa GitHub Pages." : "";
      log("log-net-err", { label: "NET ERROR ["+e.constructor.name+"]", url: url, ms: ms2, error: e.message + hint });
      if (window.__logError) window.__logError("NET ERROR", e.message + hint, e.stack);
      throw e;
    }
  }

  // ---- Load executions ----
  async function loadHistory() {
    try {
      var r = await apiFetch(API_BASE + "/mta/executions", { headers: authHeaders() });
      var data = JSON.parse(r.text);
      renderTable(Array.isArray(data) ? data : (data.executions || data.data || data.results || data.items || []));
    } catch(e) {
      document.getElementById("tableWrap").innerHTML =
        '<div class="empty">Error cargando el histórico: ' + esc(e.message) + '</div>';
    }
  }

  function pickField(r, keys) {
    for (var i = 0; i < keys.length; i++) if (r[keys[i]] !== undefined && r[keys[i]] !== null) return r[keys[i]];
    return null;
  }

  function renderTable(rows) {
    if (!rows.length) {
      document.getElementById("tableWrap").innerHTML = '<div class="empty">No hay ejecuciones registradas.</div>';
      return;
    }

    var idKey    = pickField(rows[0], ["id","_id","task_id","taskId","execution_id","run_id"]);
    var userKey  = pickField(rows[0], ["username","user","user_id","owner","created_by","email"]);
    var dateKey  = pickField(rows[0], ["created_at","createdAt","date","timestamp","start_date","started_at","add_date","executed_at"]);
    var statKey  = pickField(rows[0], ["status","state","result"]);

    // detect actual key names from first object
    var allKeys = Object.keys(rows[0]);
    function findKey(candidates) {
      for (var i = 0; i < candidates.length; i++) if (allKeys.indexOf(candidates[i]) !== -1) return candidates[i];
      return null;
    }
    var kId   = findKey(["id","_id","task_id","taskId","execution_id","run_id"]);
    var kUser = findKey(["username","user","user_id","owner","created_by","email"]);
    var kDate = findKey(["created_at","createdAt","date","timestamp","start_date","started_at","add_date","executed_at"]);
    var kStat = findKey(["status","state","result"]);

    var html = '<div class="tbl-wrap"><table><thead><tr>' +
      '<th>' + esc(kId || "ID") + '</th>' +
      '<th>' + esc(kUser || "Usuario") + '</th>' +
      '<th>' + esc(kDate || "Fecha") + '</th>' +
      '<th>' + esc(kStat || "Estado") + '</th>' +
      '<th></th></tr></thead><tbody>';

    rows.forEach(function(r) {
      var id     = kId   ? String(r[kId])   : "—";
      var user   = kUser ? String(r[kUser]) : "—";
      var date   = kDate ? formatDate(r[kDate]) : "—";
      var status = kStat ? String(r[kStat]).toLowerCase() : "unknown";
      var badge  = badgeClass(status);
      var hasId  = id && id !== "—";
      html += '<tr>' +
        '<td class="id-cell" title="' + esc(id) + '">' + esc(id) + '</td>' +
        '<td>' + esc(user) + '</td>' +
        '<td style="white-space:nowrap">' + esc(date) + '</td>' +
        '<td><span class="badge ' + badge + '">' + esc(status) + '</span></td>' +
        '<td>' + (hasId
          ? '<button class="btn-detail" onclick="openDetail(\'' + esc(id) + '\', this)">Ver detalle</button>'
          : '<span style="color:#4a7a4a;font-size:11px">Sin ID</span>') + '</td>' +
        '</tr>';
    });
    html += '</tbody></table></div>';
    document.getElementById("tableWrap").innerHTML = html;
  }

  // ---- Detail ----
  var activeBtn = null;
  async function openDetail(id, btn) {
    if (activeBtn) activeBtn.classList.remove("active");
    activeBtn = btn;
    btn.classList.add("active");

    var panel = document.getElementById("detailPanel");
    panel.style.display = "block";
    panel.scrollIntoView({ behavior: "smooth", block: "start" });
    document.getElementById("detailId").textContent = id;
    document.getElementById("detailContent").innerHTML = '<div class="loading"><div class="spinner"></div> Cargando detalle…</div>';

    try {
      var r = await apiFetch(API_BASE + "/agents/callagent-orchestrator/task/" + encodeURIComponent(id), {
        headers: authHeaders()
      });
      var data = JSON.parse(r.text);
      var text = extractText(data.status || data);
      document.getElementById("detailContent").innerHTML = text
        ? renderMarkdown(text)
        : '<pre style="white-space:pre-wrap;font-size:12px;color:#6b9e6b">' + esc(JSON.stringify(data, null, 2)) + '</pre>';
    } catch(e) {
      document.getElementById("detailContent").innerHTML = '<span style="color:#f87171">Error: ' + esc(e.message) + '</span>';
    }
  }

  function closeDetail() {
    document.getElementById("detailPanel").style.display = "none";
    if (activeBtn) { activeBtn.classList.remove("active"); activeBtn = null; }
  }

  // ---- Helpers ----
  function extractText(statusObj) {
    if (!statusObj) return null;
    var msg = statusObj.message;
    if (!msg) return null;
    var parts = msg.parts || msg.content || [];
    var texts = parts.filter(function(p){ return p && (p.kind==="text"||p.type==="text") && p.text; }).map(function(p){ return p.text; });
    if (texts.length) return texts.join("\n\n");
    if (typeof msg === "string") return msg;
    return null;
  }

  function badgeClass(s) {
    if (s==="completed"||s==="done"||s==="success") return "badge-completed";
    if (s==="working"||s==="running"||s==="pending") return "badge-working";
    if (s==="failed"||s==="error") return "badge-failed";
    return "badge-unknown";
  }

  function formatDate(v) {
    if (!v) return "—";
    var d = new Date(v);
    if (isNaN(d)) return v;
    return d.toLocaleString("es-ES", {day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  }

  function esc(s) {
    return (s||"").toString().replace(/[&<>"']/g, function(c){
      return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // ---- Markdown renderer ----
  function renderMarkdown(md) {
    var lines = md.split("\n");
    var out = [];
    var inTable = false;
    var tableRows = [];

    function flushTable() {
      if (!tableRows.length) return;
      var h = out;
      var header = tableRows[0];
      var body = tableRows.slice(2); // skip separator row
      var html = "<table><thead><tr>" +
        header.map(function(c){ return "<th>" + inlineRender(c) + "</th>"; }).join("") +
        "</tr></thead><tbody>";
      body.forEach(function(row) {
        html += "<tr>" + row.map(function(c){ return "<td>" + inlineRender(c) + "</td>"; }).join("") + "</tr>";
      });
      html += "</tbody></table>";
      out.push(html);
      tableRows = [];
      inTable = false;
    }

    lines.forEach(function(line) {
      if (line.trim().startsWith("|")) {
        inTable = true;
        var cells = line.split("|").slice(1,-1).map(function(c){ return c.trim(); });
        tableRows.push(cells);
        return;
      }
      if (inTable) flushTable();

      if (/^### /.test(line)) { out.push("<h3>" + inlineRender(line.slice(4)) + "</h3>"); return; }
      if (/^## /.test(line))  { out.push("<h2>" + inlineRender(line.slice(3)) + "</h2>"); return; }
      if (/^# /.test(line))   { out.push("<h1>" + inlineRender(line.slice(2)) + "</h1>"); return; }
      if (/^---+$/.test(line.trim())) { out.push("<hr>"); return; }
      if (/^[-*] /.test(line)) { out.push("<ul><li>" + inlineRender(line.slice(2)) + "</li></ul>"); return; }
      if (/^\d+\. /.test(line)) { out.push("<ol><li>" + inlineRender(line.replace(/^\d+\. /,"")) + "</li></ol>"); return; }
      if (line.trim() === "") { out.push("<br>"); return; }
      out.push("<p>" + inlineRender(line) + "</p>");
    });
    if (inTable) flushTable();

    // Merge consecutive ul/ol
    var html = out.join("\n")
      .replace(/<\/ul>\n<ul>/g, "")
      .replace(/<\/ol>\n<ol>/g, "");
    return html;
  }

  function inlineRender(text) {
    return text
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\*(.+?)\*/g, "<em>$1</em>")
      .replace(/`(.+?)`/g, "<code>$1</code>")
      .replace(/<br>/g, "<br>");
  }

  loadHistory();
</script>
</body>
</html>
