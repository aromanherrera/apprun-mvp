<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Runloop – Generación de rutas</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>
  <style>
    :root{color-scheme:dark}
    body{margin:0;background:#0b0c10;color:#e8f0fe;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif}
    header{padding:16px;border-bottom:1px solid #1b2131;background:#0d1017}
    h1{margin:0;font-size:20px}
    .wrap{display:grid;grid-template-columns:420px 1fr;gap:16px;padding:16px}
    @media(max-width:1000px){.wrap{grid-template-columns:1fr}}
    .card{background:#11131a;border:1px solid #1b2131;border-radius:12px;padding:12px}
    label{font-size:13px;color:#9fb3c8;display:block;margin-top:8px}
    input,select,button{width:100%;padding:10px;margin-top:6px;border-radius:10px;border:1px solid #243247;background:#0f1320;color:#e8f0fe}
    button{cursor:pointer;background:#25a244;border-color:#1f6f34;font-weight:600}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    .row>div{flex:1 1 160px}
    .map{height:600px;border-radius:12px;overflow:hidden;margin-top:10px}
    .note{font-size:13px;padding:8px;border:1px dashed #3b82f6;border-radius:8px;background:#0f1320;margin-top:8px;display:none}
    .btn-blue{background:#3b82f6;border-color:#215ab6}
    .danger{background:#e55353;border-color:#9c2f2f}
    pre{white-space:pre-wrap;background:#0f1320;border:1px solid #243247;padding:8px;border-radius:8px;max-height:240px;overflow:auto}
  </style>
</head>
<body>
  <header>
    <h1>🏃 Runloop – Generación de rutas</h1>
    <div class="row" style="margin-top:8px">
      <div style="flex:1 1 60%"><small>API: <code>https://djz7dstg9k.execute-api.eu-west-1.amazonaws.com</code></small></div>
      <div style="flex:1 1 40%;text-align:right">
        <a href="run.html" style="text-decoration:none"><button class="btn-blue">▶️ Ir a “Salir a correr”</button></a>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="card">
      <h2>Preferencias</h2>
      <div class="row">
        <div>
          <label>Lat,lon inicio (por defecto)</label>
          <input id="latlon" value="38.95483,-5.86168"/>
        </div>
        <div>
          <label>Distancia objetivo (km)</label>
          <input id="km" type="number" value="15" min="0.5" step="0.5"/>
        </div>
        <div>
          <label>Superficie</label>
          <select id="surface">
            <option value="paved" selected>Siempre asfalto</option>
            <option value="unpaved">Mayormente tierra</option>
          </select>
        </div>
      </div>

      <div class="row" style="margin-top:8px">
        <button id="btn1" style="flex:1">Generar 1 ruta</button>
        <button id="btn5" style="flex:1">Generar 5 rutas</button>
      </div>

      <button id="btnToRun" class="btn-blue" style="margin-top:8px" disabled>Usar ruta destacada en “Salir a correr”</button>
      <button id="btnExport" style="margin-top:8px">Exportar GPX (destacada)</button>
      <div id="note" class="note"></div>

      <details style="margin-top:8px">
        <summary>Depuración</summary>
        <pre id="dbg"></pre>
      </details>
    </div>

    <div class="card">
      <h2>Mapa</h2>
      <div id="map" class="map"></div>
      <div class="row" style="margin-top:8px">
        <button id="btnClear" class="danger" style="width:auto">Limpiar</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://djz7dstg9k.execute-api.eu-west-1.amazonaws.com";
    const MAPBOX_TOKEN = "pk.eyJ1IjoiYXJvbWFuaGVycmVyYSIsImEiOiJjbWdkaXdlNHIxazFoMmxzODZhcGI3enhkIn0.qCuSZ6-OgwlucpyyWHH1XA";
    const $ = id => document.getElementById(id);

    const S = { map:null, baseLayer:null, startMarker:null, variantLayers:[], highlightLayer:null, highlighted:null };

    function initMap(){
      if (S.map) S.map.remove();
      const [lat,lon] = $('latlon').value.split(',').map(Number);
      S.map = L.map('map').setView([lat,lon], 13);
      const url = `https://api.mapbox.com/styles/v1/{id}/tiles/512/{z}/{x}/{y}@2x?access_token=${MAPBOX_TOKEN}`;
      S.baseLayer = L.tileLayer(url, { id:'mapbox/outdoors-v12', tileSize:512, zoomOffset:-1, maxZoom:19, attribution:'© Mapbox © OpenStreetMap' }).addTo(S.map);
      if (S.startMarker) S.map.removeLayer(S.startMarker);
      S.startMarker = L.marker([lat,lon], { title:'Inicio' }).addTo(S.map).bindPopup('Inicio');
      setTimeout(()=> S.map.invalidateSize(), 150);
    }
    initMap();
    $('latlon').addEventListener('change', initMap);

    function clearMap(){
      S.variantLayers.forEach(v=> S.map.removeLayer(v.layer));
      S.variantLayers = [];
      if (S.highlightLayer){ S.map.removeLayer(S.highlightLayer); S.highlightLayer=null; }
      S.highlighted = null;
      $('note').style.display='none';
      $('dbg').textContent='';
      $('btnToRun').disabled = true;
    }
    $('btnClear').onclick = clearMap;

    async function fx(path, {method='GET', body=null}={}){
      const h = {}; let reqBody;
      if (body!==null && body!==undefined){ h['Content-Type']='application/json'; reqBody = JSON.stringify(body); }
      const r = await fetch(API_BASE.replace(/\/+$/,'') + path, {method, headers:h, body:reqBody});
      const txt = await r.text(); let data=null; try{ data=JSON.parse(txt);}catch{ data=txt; }
      return { ok:r.ok, status:r.status, data };
    }

    function drawHighlight(geom){
      if (S.highlightLayer) S.map.removeLayer(S.highlightLayer);
      S.highlightLayer = L.geoJSON(geom, { style:{ color:'#3388ff', weight:6, opacity:0.9 } }).addTo(S.map);
      const b = S.highlightLayer.getBounds(); if (b.isValid()) S.map.fitBounds(b, { padding:[30,30] });
    }
    function drawVariant(geom, onClick){
      const layer = L.geoJSON(geom, { style:{ color:'#888', weight:3, opacity:0.6 } }).addTo(S.map);
      layer.on('click', onClick);
      return layer;
    }

    function saveForRun(route){
      const payload = {
        route_id: route.route_id,
        distance_m: route.distance_m,
        geom: route.geom,
        start_point: route.start_point,
        end_point: route.end_point,
        saved_at: new Date().toISOString()
      };
      localStorage.setItem('runloop_target_route', JSON.stringify(payload));
    }
    $('btnToRun').onclick = ()=> {
      if (!S.highlighted) return alert('No hay ruta destacada');
      saveForRun(S.highlighted);
      window.location.href = 'run.html';
    };

    $('btnExport').onclick = async ()=>{
      if (!S.highlighted?.route_id) return alert('No hay ruta destacada');
      const r = await fx(`/routes/${S.highlighted.route_id}/export`, {method:'POST'});
      if (r.ok && r.data?.url) window.open(r.data.url, '_blank'); else alert('No se pudo exportar GPX');
    };

    function buildPayload(seed){
      const [lat,lon] = $('latlon').value.split(',').map(Number);
      const km = parseFloat($('km').value||'10');
      const surface = $('surface').value;
      return {
        start: { lat, lon },
        distance_m: Math.max(500, km*1000),
        round_trip: true,
        surface_pref: surface,
        seed
      };
    }

    async function generateOne(seed){
      const payload = buildPayload(seed);
      const res = await fx('/routes/generate', { method:'POST', body:payload });
      $('dbg').textContent = JSON.stringify(res.data, null, 2);
      if (!res.ok) throw new Error(res.data?.message||'Error generando ruta');
      if (!res.data?.geom?.coordinates?.length) throw new Error('Respuesta sin geometría');

      if (res.data.surface_note){
        const n=$('note'); n.style.display='block'; n.textContent=res.data.surface_note + (res.data.distance_within_10pct ? ' (±10% OK)' : '');
      } else { $('note').style.display='none'; }

      return {
        route_id: res.data.route_id,
        distance_m: res.data.distance_m,
        geom: res.data.geom,
        start_point: res.data.start_point,
        end_point: res.data.end_point
      };
    }

    $('btn1').onclick = async ()=>{
      clearMap();
      try{
        const seed = Math.floor(Math.random()*1e6);
        const r = await generateOne(seed);
        S.highlighted = r;
        drawHighlight(r.geom);
        $('btnToRun').disabled = false;
      }catch(e){ alert('Error: ' + e.message); }
    };

    $('btn5').onclick = async ()=>{
      clearMap();
      try{
        // 5 seeds realmente distintos
        const base = Math.floor(Math.random()*1e6);
        const seeds = [base, base+97, base+193, base+349, base+571];
        const routes = [];
        for (const s of seeds){
          try{
            const r = await generateOne(s);
            routes.push(r);
          }catch(e){
            // si alguna falla, seguimos con las restantes
            console.warn('Variante fallida', e.message);
          }
        }
        if (!routes.length) throw new Error('No se pudo generar ninguna variante');

        // primera destacada
        const main = routes[0];
        S.highlighted = main;
        drawHighlight(main.geom);
        $('btnToRun').disabled = false;

        // pinta el resto en gris y permite resaltarlas
        routes.slice(1).forEach(r=>{
          const layer = drawVariant(r.geom, ()=>{
            S.highlighted = r;
            drawHighlight(r.geom);
          });
          S.variantLayers.push({ layer, r });
        });
      }catch(e){ alert('Error (variantes): ' + e.message); }
    };
  </script>
</body>
</html>
