<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runloop – Salir a correr</title>
  <style>
    :root{color-scheme:dark}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;background:#0b0c10;color:#e8f0fe;margin:0;padding:16px}
    header{display:flex;gap:12px;align-items:center;margin-bottom:12px}
    a.btn{display:inline-block;text-decoration:none}
    .btn{padding:10px 12px;border-radius:8px;border:1px solid #215ab6;background:#3b82f6;color:#fff;font-weight:600}
    .card{background:#11131a;border:1px solid #1b2131;border-radius:12px;padding:12px;max-width:820px;margin:0 auto}
    label{font-size:13px;color:#9fb3c8;display:block;margin-top:8px}
    input,button{width:100%;padding:10px;margin-top:6px;border-radius:10px;border:1px solid #243247;background:#0f1320;color:#e8f0fe}
    button{cursor:pointer;background:#25a244;border-color:#1f6f34;font-weight:600}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .row>div{flex:1 1 180px}
    .stat{font-size:28px}
    .muted{opacity:.7}
    .controls{display:flex;gap:10px;margin-top:12px}
    .controls button{flex:1}
    progress{width:100%;height:14px;border-radius:8px}
    .pill{display:inline-block;padding:4px 8px;border-radius:999px;border:1px solid #243247;background:#0f1320;font-size:12px}
    .danger{background:#e55353;border-color:#9c2f2f}
    small code{background:#0f1320;border:1px solid #243247;padding:2px 6px;border-radius:6px}
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="btn">⬅️ Volver al generador</a>
    <h1 style="margin:0">🏃 Salir a correr</h1>
  </header>

  <div class="card">
    <label>API Base URL (fija)</label>
    <input id="apiBase" disabled />

    <div id="goalBox" style="margin-top:6px">
      <div class="row" style="align-items:flex-end">
        <div>
          <label>Ruta objetivo</label>
          <div><span id="goalDist" class="pill">Sin objetivo</span></div>
        </div>
        <div>
          <label>Restante</label>
          <div class="stat"><span id="goalRemain">—</span></div>
        </div>
        <div>
          <label>Progreso</label>
          <progress id="goalProg" max="1" value="0"></progress>
        </div>
      </div>
      <div class="row">
        <button id="btnClearGoal" class="danger" style="flex:0 0 180px">Quitar objetivo</button>
      </div>
    </div>

    <div class="row" style="margin-top:12px;align-items:flex-end">
      <div><label>Distancia</label><div class="stat"><span id="dist">0.00</span> km</div></div>
      <div><label>Velocidad</label><div class="stat"><span id="speed">0.0</span> km/h</div></div>
      <div><label>Ritmo</label><div class="stat"><span id="pace">—</span> /km</div></div>
      <div><label>Tiempo</label><div class="stat"><span id="time">00:00</span></div></div>
    </div>

    <div class="row" style="margin-top:4px">
      <div><small class="muted">GPS: <span id="gpsState">parado</span></small></div>
      <div><small class="muted">Precisión: ±<span id="acc">—</span> m</small></div>
      <div><small class="muted">Último fix: <span id="lastFix">—</span>s</small></div>
      <div><small class="muted">Muestras/5min: <span id="samples">0</span></small></div>
    </div>

    <div class="controls">
      <button id="btnPlay">▶︎ Play</button>
      <button id="btnPause" style="background:#f0ad4e;border-color:#b37e2e">⏸️ Pause</button>
      <button id="btnStop"  style="background:#e55353;border-color:#9c2f2f">■ Stop</button>
    </div>

    <p class="muted" style="margin-top:10px">
      Si Safari muestra “Permiso denegado”, toca <b>aA</b> → <i>Ajustes del sitio web</i> → <i>Localización</i> → <b>Permitir</b>.
    </p>
  </div>

  <script>
    // ===== Config fija =====
    const API_BASE = "https://djz7dstg9k.execute-api.eu-west-1.amazonaws.com";
    const $ = id => document.getElementById(id);

    // Umbrales y filtros (ajustados para running)
    const MAX_ACCURACY_M = 50;        // descartar puntos peores a 50 m
    const MAX_JUMP_M = 100;           // descartar saltos mayores a 100 m
    const MAX_SPEED_MS = 8;           // 8 m/s ~ 28.8 km/h
    const SPEED_WINDOW_S = 6;         // ventana deslizante 6 s
    const SPEED_EMA_ALPHA = 0.35;     // suavizado

    const state = {
      runId: null, watchingId: null, tickerId: null,
      active: false, lastPoint: null,
      distMeters: 0, gain: 0,
      t0: null, pauseAccum: 0, pausedAt: null,
      batch: [],
      goal: null, // { route_id, distance_m }
      // buffers y métricas
      pathBuffer: [],  // [{ts,lat,lon,alt,acc}]
      emaSpeed: null,
      lastFixTs: null,
      sampleCountWindow: [] // timestamps para muestras/5min
    };
    $('apiBase').value = API_BASE;

    // ===== Utilidades =====
    function apiUrl(p){ return API_BASE.replace(/\/+$/,'') + p; }
    function fmtTime(ms){ const s=Math.floor(ms/1000), m=Math.floor(s/60), r=s%60; return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`; }
    function hav(lat1, lon1, lat2, lon2){
      const R=6371000,toRad=d=>d*Math.PI/180;
      const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
      const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
      return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    }
    function kmhToPace(kmh){
      if (!Number.isFinite(kmh) || kmh<=0) return '—';
      const minTotal = 60 / kmh;
      const min = Math.floor(minTotal);
      const sec = Math.round((minTotal - min) * 60);
      return `${min}:${String(sec).padStart(2,'0')}`;
    }

    async function fx(path, {method='GET', body=null}={}){
      const h = {}; let reqBody;
      if (body!==null && body!==undefined){ h['Content-Type']='application/json'; reqBody=JSON.stringify(body); }
      const r = await fetch(apiUrl(path), {method, headers:h, body:reqBody});
      const txt = await r.text(); let data=null; try{ data=JSON.parse(txt);}catch{ data=txt; }
      return { ok:r.ok, status:r.status, data };
    }

    // ===== Objetivo =====
    (function loadGoal(){
      try{
        const raw = localStorage.getItem('runloop_target_route');
        if (raw) {
          const g = JSON.parse(raw);
          if (g && g.distance_m && Number.isFinite(g.distance_m)) {
            state.goal = g;
            const km = (g.distance_m/1000).toFixed(2);
            $('goalDist').textContent = `${km} km ${g.route_id ? `(${g.route_id})` : ''}`;
            $('goalRemain').textContent = `${km} km`;
            $('goalProg').max = g.distance_m;
            $('goalProg').value = 0;
          }
        }
      }catch{}
    })();

    function updateGoalProgressUI(){
      if (!state.goal?.distance_m) return;
      const done = state.distMeters;
      const total = state.goal.distance_m;
      const remain = Math.max(0, total - done);
      $('goalRemain').textContent = `${(remain/1000).toFixed(2)} km`;
      $('goalProg').max = total;
      $('goalProg').value = done;
    }

    // ===== Métrica de velocidad estable =====
    function updateSpeedFromWindow(){
      const now = Date.now();
      const cutoff = now - SPEED_WINDOW_S*1000;
      // limpia puntos viejos
      while (state.pathBuffer.length && state.pathBuffer[0].ts < cutoff) state.pathBuffer.shift();
      if (state.pathBuffer.length < 2) return null;

      // distancia fiable dentro de la ventana (filtrada)
      let d=0;
      for (let i=1;i<state.pathBuffer.length;i++){
        const a = state.pathBuffer[i-1], b = state.pathBuffer[i];
        // descarta si cualquiera tiene mala accuracy
        if ((a.acc??0) > MAX_ACCURACY_M || (b.acc??0) > MAX_ACCURACY_M) continue;
        const dd = hav(a.lat,a.lon,b.lat,b.lon);
        const dt = Math.max(0.001, (b.ts - a.ts)/1000);
        if (dd > MAX_JUMP_M) continue;
        const inst = dd/dt;           // m/s
        if (inst > MAX_SPEED_MS) continue;
        // cap distancia por velocidad máxima
        const capped = Math.min(dd, MAX_SPEED_MS * dt);
        d += capped;
      }
      const dtWin = (state.pathBuffer[state.pathBuffer.length-1].ts - state.pathBuffer[0].ts)/1000;
      if (dtWin <= 0) return null;

      const kmh = (d/1000) / (dtWin/3600); // km/h
      state.emaSpeed = (state.emaSpeed==null) ? kmh : (state.emaSpeed*(1-SPEED_EMA_ALPHA) + kmh*SPEED_EMA_ALPHA);
      return state.emaSpeed;
    }

    // ===== Lógica de puntos =====
    function acceptPointFix(prev, cur){
      // Reglas de aceptación de un nuevo punto
      if (!cur) return false;
      if ((cur.acc??0) > MAX_ACCURACY_M) return false;
      if (!prev) return true;

      const dt = Math.max(0.001, (cur.ts - prev.ts)/1000);
      if (dt <= 0) return false;

      const dd = hav(prev.lat, prev.lon, cur.lat, cur.lon);
      if (dd > MAX_JUMP_M) return false;

      const v = dd/dt; // m/s
      if (v > MAX_SPEED_MS) return false;

      return true;
    }

    function addDistance(prev, cur){
      const dt = Math.max(0.001, (cur.ts - prev.ts)/1000);
      let dd = hav(prev.lat, prev.lon, cur.lat, cur.lon);
      // cap distancia por velocidad máxima aceptable
      dd = Math.min(dd, MAX_SPEED_MS * dt);
      state.distMeters += dd;
    }

    // ===== UI tiempo y estado (1 Hz) =====
    function startTicker(){
      if (state.tickerId) return;
      const tick = () => {
        const running = state.active;
        const now = Date.now();
        const elapsed = (state.t0 ? now - state.t0 - state.pauseAccum : 0);
        $('time').textContent = fmtTime(elapsed);
        // goal
        updateGoalProgressUI();
        // edad del último fix
        const age = state.lastFixTs ? Math.round((now - state.lastFixTs)/1000) : '—';
        $('lastFix').textContent = String(age);
      };
      tick();
      state.tickerId = setInterval(tick, 1000);
    }
    function stopTicker(){
      if (state.tickerId){ clearInterval(state.tickerId); state.tickerId=null; }
    }

    // ===== GPS callbacks =====
    function onPos(raw){
      const ts = Date.now();
      const lat = raw.coords.latitude;
      const lon = raw.coords.longitude;
      const alt = Number.isFinite(raw.coords.altitude) ? raw.coords.altitude : null;
      const acc = Number.isFinite(raw.coords.accuracy) ? raw.coords.accuracy : null;

      state.lastFixTs = ts;
      $('gpsState').textContent = state.active ? 'grabando' : 'en pausa';
      $('acc').textContent = acc!=null ? Math.round(acc) : '—';

      const cur = { ts, lat, lon, alt, acc };

      // buffer para velocidad
      state.pathBuffer.push(cur);

      if (state.active){
        if (acceptPointFix(state.lastPoint, cur)){
          if (state.lastPoint) addDistance(state.lastPoint, cur);
          state.lastPoint = cur;

          // actualizar UI de distancia y velocidad
          $('dist').textContent = (state.distMeters/1000).toFixed(2);
          const sp = updateSpeedFromWindow();
          if (Number.isFinite(sp)) {
            $('speed').textContent = sp.toFixed(1);
            $('pace').textContent  = kmhToPace(sp);
          }

          // batch de tracking
          state.batch.push({
            ts, lat, lon,
            speed_kmh: Number.isFinite(state.emaSpeed)? +state.emaSpeed.toFixed(2) : null,
            acc: acc ?? null
          });
          if (state.batch.length >= 5) sendBatch();
        }
      }

      // contador de muestras (para ver calidad del GPS)
      state.sampleCountWindow.push(ts);
      const cutoff = ts - 5*60*1000;
      while (state.sampleCountWindow.length && state.sampleCountWindow[0] < cutoff) state.sampleCountWindow.shift();
      $('samples').textContent = state.sampleCountWindow.length;
    }

    function onGeoError(err){
      const map = {
        1: 'Permiso denegado. En Safari pulsa aA → Ajustes del sitio web → Localización → Permitir.',
        2: 'Posición no disponible. Activa el GPS o sal al exterior.',
        3: 'Tiempo de espera agotado. Inténtalo de nuevo.'
      };
      alert('GPS error: ' + (map[err.code] || err.message || 'desconocido'));
    }

    // ===== API runs =====
    async function startRun(){
      const r = await fx('/runs/start', {method:'POST', body:{
        goal_route_id: state.goal?.route_id || null,
        goal_distance_m: state.goal?.distance_m || null
      }});
      if (!r.ok) throw new Error(r.data?.message||'Error start');
      state.runId = r.data.run_id;
      state.t0 = Date.now();
      state.pauseAccum = 0;
      state.pathBuffer = [];
      state.emaSpeed = null;
      state.distMeters = 0;
      $('dist').textContent = '0.00';
      $('speed').textContent = '0.0';
      $('pace').textContent  = '—';
      $('time').textContent = '00:00';
    }

    async function sendBatch(){
      if (!state.runId || state.batch.length===0) return;
      const payload = { points: state.batch.slice(0) };
      state.batch = [];
      await fx(`/runs/${state.runId}/track`, {method:'POST', body:payload}).catch(()=>{});
    }

    async function finishRun(){
      const r = await fx(`/runs/${state.runId}/finish`, {
        method:'POST',
        body:{
          dist_m: state.distMeters,
          gain_m: state.gain, // seguimos acumulándola (no se muestra en vivo)
          duration_s: Math.round((Date.now()-state.t0-state.pauseAccum)/1000),
          goal_distance_m: state.goal?.distance_m || null,
          goal_route_id: state.goal?.route_id || null
        }
      });
      if (!r.ok) throw new Error(r.data?.message||'Error finish');
      return r.data;
    }

    // ===== Botones =====
    document.getElementById('btnPlay').onclick = async () => {
      try {
        // pedir un fix inicial “rápido”
        const getOnce = (opts)=> new Promise((res,rej)=> navigator.geolocation.getCurrentPosition(res,rej,opts));
        try {
          await getOnce({ enableHighAccuracy:true, timeout:12000, maximumAge:1000 });
        } catch {
          // intentarlo con menos precisión
          await getOnce({ enableHighAccuracy:false, timeout:12000, maximumAge:5000 });
        }

        if (!state.runId) await startRun();

        state.active = true;
        $('gpsState').textContent = 'grabando';
        if (state.pausedAt) { state.pauseAccum += (Date.now()-state.pausedAt); state.pausedAt=null; }

        // Ticker 1 Hz
        startTicker();

        // Watch GPS (alta frecuencia dentro de lo razonable)
        if (!state.watchingId){
          const watchOpts = { enableHighAccuracy:true, maximumAge:1000, timeout:10000 };
          state.watchingId = navigator.geolocation.watchPosition(onPos, onGeoError, watchOpts);
        }
      } catch (e) {
        onGeoError(e);
        console.warn('Geo fail detail:', e);
      }
    };

    document.getElementById('btnPause').onclick = () => {
      state.active = false;
      $('gpsState').textContent = 'en pausa';
      state.pausedAt = Date.now();
      sendBatch();
    };

    document.getElementById('btnStop').onclick = async () => {
      state.active = false;
      $('gpsState').textContent = 'parado';
      await sendBatch();
      if (state.watchingId){ navigator.geolocation.clearWatch(state.watchingId); state.watchingId=null; }
      stopTicker();
      if (state.runId){
        try{
          const sum = await finishRun();
          const goalTxt = state.goal?.distance_m ? `\nObjetivo: ${(state.goal.distance_m/1000).toFixed(2)} km` : '';
          alert(`Guardado ✅
Dist: ${(sum.dist_m/1000).toFixed(2)} km
Tiempo: ${fmtTime(sum.duration_s*1000)}
Desnivel+: ${Math.round(sum.gain_m)} m${goalTxt}`);
        }catch(e){ alert('Error al guardar: '+e.message); }
      }
      // reset parcial
      state.runId = null; state.lastPoint=null; state.distMeters=0; state.gain=0;
      state.pathBuffer=[]; state.emaSpeed=null; state.sampleCountWindow=[];
      $('dist').textContent = '0.00'; $('speed').textContent = '0.0'; $('pace').textContent = '—'; $('time').textContent='00:00';
      $('lastFix').textContent='—'; $('acc').textContent='—'; $('samples').textContent='0';
      updateGoalProgressUI();
    };

    document.getElementById('btnClearGoal').onclick = () => {
      localStorage.removeItem('runloop_target_route');
      state.goal = null;
      $('goalDist').textContent = 'Sin objetivo';
      $('goalRemain').textContent = '—';
      $('goalProg').value = 0;
      $('goalProg').max = 1;
      alert('Objetivo eliminado.');
    };

    // ===== Inicialización =====
    (function init(){
      if (!('geolocation' in navigator)) alert('Tu navegador no soporta geolocalización.');
    })();
  </script>
</body>
</html>
