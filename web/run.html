<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runloop – Salir a correr</title>
  <style>
    :root{color-scheme:dark}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;background:#0b0c10;color:#e8f0fe;margin:0;padding:16px}
    header{display:flex;gap:12px;align-items:center;margin-bottom:12px}
    a.btn{display:inline-block;text-decoration:none}
    .btn{padding:10px 12px;border-radius:8px;border:1px solid #215ab6;background:#3b82f6;color:#fff;font-weight:600}
    .card{background:#11131a;border:1px solid #1b2131;border-radius:12px;padding:12px;max-width:760px;margin:0 auto}
    label{font-size:13px;color:#9fb3c8;display:block;margin-top:8px}
    input,button{width:100%;padding:10px;margin-top:6px;border-radius:10px;border:1px solid #243247;background:#0f1320;color:#e8f0fe}
    button{cursor:pointer;background:#25a244;border-color:#1f6f34;font-weight:600}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .row>div{flex:1 1 180px}
    .stat{font-size:28px}
    .muted{opacity:.7}
    .controls{display:flex;gap:10px;margin-top:12px}
    .controls button{flex:1}
    progress{width:100%;height:14px;border-radius:8px}
    .pill{display:inline-block;padding:4px 8px;border-radius:999px;border:1px solid #243247;background:#0f1320;font-size:12px}
    .danger{background:#e55353;border-color:#9c2f2f}
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="btn">⬅️ Volver al generador</a>
    <h1 style="margin:0">🏃 Salir a correr</h1>
  </header>

  <div class="card">
    <label>API Base URL (fija)</label>
    <input id="apiBase" disabled />

    <div id="goalBox" style="margin-top:6px">
      <div class="row" style="align-items:flex-end">
        <div>
          <label>Ruta objetivo</label>
          <div><span id="goalDist" class="pill">Sin objetivo</span></div>
        </div>
        <div>
          <label>Restante</label>
          <div class="stat"><span id="goalRemain">—</span></div>
        </div>
        <div>
          <label>Progreso</label>
          <progress id="goalProg" max="1" value="0"></progress>
        </div>
      </div>
      <div class="row">
        <button id="btnClearGoal" class="danger" style="flex:0 0 180px">Quitar objetivo</button>
      </div>
    </div>

    <div class="row" style="margin-top:12px">
      <div><label>Distancia</label><div class="stat"><span id="dist">0.00</span> km</div></div>
      <div><label>Velocidad</label><div class="stat"><span id="speed">0.0</span> km/h</div></div>
      <div><label>Tiempo</label><div class="stat"><span id="time">00:00</span></div></div>
    </div>

    <div class="controls">
      <button id="btnPlay">▶︎ Play</button>
      <button id="btnPause" style="background:#f0ad4e;border-color:#b37e2e">⏸️ Pause</button>
      <button id="btnStop"  style="background:#e55353;border-color:#9c2f2f">■ Stop</button>
    </div>

    <p class="muted" style="margin-top:10px">
      Si Safari muestra “Permiso denegado”, toca <b>aA</b> → <i>Ajustes del sitio web</i> → <i>Localización</i> → <b>Permitir</b>.
    </p>
  </div>

  <script>
    // ===== Config fija =====
    const API_BASE = "https://djz7dstg9k.execute-api.eu-west-1.amazonaws.com";
    const $ = id => document.getElementById(id);

    const state = {
      runId: null, watchingId: null,
      active: false, lastPoint: null,
      distMeters: 0, gain: 0,
      t0: null, pauseAccum: 0, pausedAt: null,
      batch: [],
      goal: null, // { route_id, distance_m }
      // buffers para velocidad “tipo Strava”
      windowSec: 10,
      pathBuffer: [] /* [{ts,lat,lon,alt}] */,
      emaSpeed: null, emaAlpha: 0.25
    };
    $('apiBase').value = API_BASE;

    // Carga objetivo si existe
    (function loadGoal(){
      try{
        const raw = localStorage.getItem('runloop_target_route');
        if (raw) {
          const g = JSON.parse(raw);
          if (g && g.distance_m && Number.isFinite(g.distance_m)) {
            state.goal = g;
            const km = (g.distance_m/1000).toFixed(2);
            $('goalDist').textContent = `${km} km ${g.route_id ? `(${g.route_id})` : ''}`;
            $('goalRemain').textContent = `${km} km`;
            $('goalProg').max = g.distance_m;
            $('goalProg').value = 0;
          }
        }
      }catch{}
    })();

    // Utils
    function apiUrl(p){ return API_BASE.replace(/\/+$/,'') + p; }
    function fmtTime(ms){ const s=Math.floor(ms/1000), m=Math.floor(s/60), r=s%60; return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`; }
    function hav(lat1, lon1, lat2, lon2){
      const R=6371000,toRad=d=>d*Math.PI/180;
      const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
      const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
      return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    }

    async function fx(path, {method='GET', body=null}={}){
      const h = {}; let reqBody;
      if (body!==null && body!==undefined){ h['Content-Type']='application/json'; reqBody=JSON.stringify(body); }
      const r = await fetch(apiUrl(path), {method, headers:h, body:reqBody});
      const txt = await r.text(); let data=null; try{ data=JSON.parse(txt);}catch{ data=txt; }
      return { ok:r.ok, status:r.status, data };
    }

    async function startRun(){
      const r = await fx('/runs/start', {method:'POST', body:{
        goal_route_id: state.goal?.route_id || null,
        goal_distance_m: state.goal?.distance_m || null
      }});
      if (!r.ok) throw new Error(r.data?.message||'Error start');
      state.runId = r.data.run_id;
      state.t0 = Date.now();
      state.pauseAccum = 0;
      state.pathBuffer = [];
      state.emaSpeed = null;
      $('dist').textContent = '0.00';
      $('speed').textContent = '0.0';
      $('time').textContent = '00:00';
    }

    async function sendBatch(){
      if (!state.runId || state.batch.length===0) return;
      const payload = { points: state.batch.slice(0) };
      state.batch = [];
      await fx(`/runs/${state.runId}/track`, {method:'POST', body:payload}).catch(()=>{});
    }

    async function finishRun(){
      const r = await fx(`/runs/${state.runId}/finish`, {
        method:'POST',
        body:{
          dist_m: state.distMeters,
          gain_m: state.gain,
          duration_s: Math.round((Date.now()-state.t0-state.pauseAccum)/1000),
          goal_distance_m: state.goal?.distance_m || null,
          goal_route_id: state.goal?.route_id || null
        }
      });
      if (!r.ok) throw new Error(r.data?.message||'Error finish');
      return r.data;
    }

    function updateGoalProgressUI(){
      if (!state.goal?.distance_m) return;
      const done = state.distMeters;
      const total = state.goal.distance_m;
      const remain = Math.max(0, total - done);
      $('goalRemain').textContent = `${(remain/1000).toFixed(2)} km`;
      $('goalProg').max = total;
      $('goalProg').value = done;
    }

    // Velocidad tipo Strava: distancia/tiempo en ventana + EMA
    function updateSpeedFromWindow(){
      const now = Date.now();
      // limpia puntos viejos
      const cutoff = now - state.windowSec*1000;
      while (state.pathBuffer.length && state.pathBuffer[0].ts < cutoff) {
        state.pathBuffer.shift();
      }
      if (state.pathBuffer.length < 2) return null;

      // distancia total y duración en ventana
      let d=0;
      for (let i=1;i<state.pathBuffer.length;i++){
        const a = state.pathBuffer[i-1], b = state.pathBuffer[i];
        d += hav(a.lat,a.lon,b.lat,b.lon);
      }
      const dt = (state.pathBuffer[state.pathBuffer.length-1].ts - state.pathBuffer[0].ts)/1000; // s
      if (dt <= 0) return null;

      const instSpeed = (d/1000) / (dt/3600); // km/h
      // EMA para estabilizar
      state.emaSpeed = (state.emaSpeed==null) ? instSpeed : (state.emaSpeed*(1-state.emaAlpha) + instSpeed*state.emaAlpha);
      return state.emaSpeed;
    }

    function onPos(p){
      if (!state.active) return;
      const ts=Date.now();
      const lat=p.coords.latitude, lon=p.coords.longitude;
      const alt = (Number.isFinite(p.coords.altitude)? p.coords.altitude : undefined);

      // distancia incremental
      if (state.lastPoint){
        const d = hav(state.lastPoint.lat, state.lastPoint.lon, lat, lon);
        if (d < 100) {
          state.distMeters += d;
          if (alt!==undefined && state.lastPoint.alt!==undefined){
            const delta = alt - state.lastPoint.alt;
            if (delta>1) state.gain += delta; // umbral 1 m para evitar ruido
          }
        }
      }
      state.lastPoint = { lat, lon, alt, ts };

      // buffer ventana para velocidad
      state.pathBuffer.push({ ts, lat, lon, alt });

      // pintar métricas
      $('dist').textContent = (state.distMeters/1000).toFixed(2);
      const sp = updateSpeedFromWindow();
      if (Number.isFinite(sp)) $('speed').textContent = sp.toFixed(1);
      $('time').textContent = fmtTime(Date.now()-state.t0-state.pauseAccum);

      updateGoalProgressUI();

      state.batch.push({ ts, lat, lon, speed_kmh: Number.isFinite(sp)? +sp.toFixed(1) : null, alt: alt ?? null });
      if (state.batch.length >= 5) sendBatch();
    }

    // Primer fix para pedir permiso y luego watch
    function requestLocationOnce(opts){
      return new Promise((resolve, reject)=>{
        if(!('geolocation' in navigator)) return reject(new Error('Geolocalización no soportada'));
        navigator.geolocation.getCurrentPosition(resolve, reject, opts);
      });
    }
    function humanGeoError(err){
      if(!err) return 'Error desconocido';
      const map = {
        1: 'Permiso denegado. En Safari pulsa aA → Ajustes del sitio web → Localización → Permitir.',
        2: 'Posición no disponible. Activa el GPS o sal al exterior.',
        3: 'Tiempo de espera agotado. Inténtalo de nuevo.'
      };
      return map[err.code] || (err.message || 'Error de geolocalización');
    }

    document.getElementById('btnPlay').onclick = async () => {
      try {
        let fix;
        try {
          fix = await requestLocationOnce({ enableHighAccuracy:false, timeout:30000, maximumAge:15000 });
        } catch (e1) {
          if (e1.code === 1) throw e1;
          fix = await requestLocationOnce({ enableHighAccuracy:true, timeout:30000, maximumAge:0 });
        }

        if (!state.runId) await startRun();

        state.active = true;
        if (state.pausedAt) { state.pauseAccum += (Date.now()-state.pausedAt); state.pausedAt=null; }

        onPos(fix);

        if (!state.watchingId){
          const watchOpts = { enableHighAccuracy:false, maximumAge:5000, timeout:30000 };
          state.watchingId = navigator.geolocation.watchPosition(
            onPos,
            err => alert('GPS error: ' + humanGeoError(err)),
            watchOpts
          );
        }
      } catch (e) {
        alert('GPS error: ' + humanGeoError(e));
        console.warn('Geo fail detail:', e);
      }
    };

    document.getElementById('btnPause').onclick = () => {
      state.active = false;
      state.pausedAt = Date.now();
      sendBatch();
    };

    document.getElementById('btnStop').onclick = async () => {
      state.active = false;
      await sendBatch();
      if (state.watchingId){ navigator.geolocation.clearWatch(state.watchingId); state.watchingId=null; }
      if (state.runId){
        try{
          const sum = await finishRun();
          const goalTxt = state.goal?.distance_m ? `\nObjetivo: ${(state.goal.distance_m/1000).toFixed(2)} km` : '';
          alert(`Guardado ✅
Dist: ${(sum.dist_m/1000).toFixed(2)} km
Tiempo: ${fmtTime(sum.duration_s*1000)}
Desnivel+: ${Math.round(sum.gain_m)} m${goalTxt}`);
        }catch(e){ alert('Error al guardar: '+e.message); }
      }
      state.runId = null; state.lastPoint=null; state.distMeters=0; state.gain=0;
      state.pathBuffer=[]; state.emaSpeed=null;
      updateGoalProgressUI();
    };

    document.getElementById('btnClearGoal').onclick = () => {
      localStorage.removeItem('runloop_target_route');
      state.goal = null;
      $('goalDist').textContent = 'Sin objetivo';
      $('goalRemain').textContent = '—';
      $('goalProg').value = 0;
      $('goalProg').max = 1;
      alert('Objetivo eliminado.');
    };
  </script>
</body>
</html>
