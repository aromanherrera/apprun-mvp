<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runloop MVP – Generar rutas</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    body{font-family:system-ui;background:#0b0c10;color:#e8f0fe;margin:0}
    header{padding:16px;border-bottom:1px solid #1b1f2a;background:#0d1017}
    h1{margin:0;font-size:20px}
    .wrap{display:grid;grid-template-columns:420px 1fr;gap:16px;padding:16px}
    @media(max-width:900px){.wrap{grid-template-columns:1fr}}
    .card{background:#11131a;border:1px solid #1b2131;border-radius:10px;padding:12px}
    label{font-size:13px;color:#9fb3c8;display:block;margin-top:8px}
    input,select,button{width:100%;padding:8px;margin-top:4px;border-radius:8px;border:1px solid #243247;background:#0f1320;color:#e8f0fe}
    button{cursor:pointer;background:#25a244;border-color:#1f6f34;font-weight:600;margin-top:10px}
    .map{height:560px;border-radius:10px;overflow:hidden;margin-top:10px}
    .muted{opacity:.75}
    .row{display:flex;gap:8px}
  </style>
</head>
<body>
  <header>
    <h1>🏃 Runloop MVP – Generación de rutas</h1>
    <p class="muted" style="font-size:13px">Sin login, con geolocalización y 5 variantes</p>
  </header>

  <div class="wrap">
    <div class="card">
      <h2>Configuración</h2>
      <label>API Base URL (API Gateway)</label>
      <input id="apiBase" placeholder="https://xxx.execute-api.eu-west-1.amazonaws.com" />
      <div class="row">
        <div style="flex:1">
          <label>Lat/Lon por defecto</label>
          <input id="defaultLatLon" placeholder="40.4168,-3.7038" />
        </div>
        <div style="flex:1">
          <label>&nbsp;</label>
          <button id="btnUseLoc">📍 Usar mi ubicación</button>
        </div>
      </div>
      <button id="btnSaveCfg">Guardar configuración</button>
    </div>

    <div class="card">
      <h2>Mapa</h2>
      <div id="map" class="map"></div>
    </div>

    <div class="card">
      <h2>Generar rutas</h2>
      <label>Inicio (lat,lon)</label>
      <input id="routeStart" placeholder="40.4168,-3.7038" />

      <div class="row">
        <div style="flex:1">
          <label>Distancia (km)</label>
          <input id="routeKm" type="number" value="10" />
        </div>
        <div style="flex:1">
          <label>Altimetría</label>
          <select id="altPref">
            <option value="flat">Más llana</option>
            <option value="mixed" selected>Mixta</option>
            <option value="hilly">Con pendiente</option>
          </select>
        </div>
      </div>

      <label>Superficie</label>
      <select id="surfacePref">
        <option value="paved">Asfalto/alquitranado</option>
        <option value="unpaved" selected>Tierra / caminos</option>
      </select>

      <div class="row">
        <button id="btnGen1" style="flex:1">Generar 1 ruta</button>
        <button id="btnGen5" style="flex:1">Generar 5 rutas</button>
      </div>
      <button id="btnExport">Exportar GPX (ruta destacada)</button>
      <p id="routeInfo" class="muted" style="font-size:13px"></p>
      <p class="muted" style="font-size:12px;margin-top:6px">Puedes hacer clic en una ruta gris para destacarla en azul.</p>
    </div>

    <!--
    <div class="card">
      <h2>Crear evento (OCULTO EN MVP)</h2>
      (sección comentada a petición)
    </div>

    <div class="card">
      <h2>Próximos eventos (OCULTO EN MVP)</h2>
      (sección comentada a petición)
    </div>
    -->
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const S = {
      map: null, youMarker: null,
      variantLayers: [], highlightLayer: null,
      startMarker: null, endMarker: null,
      highlightedRoute: null,
      cfg: { apiBase: '', defaultLatLon: '40.4168,-3.7038' }
    };

    function loadCfg(){ try{ Object.assign(S.cfg, JSON.parse(localStorage.getItem('cfg')||'{}')); }catch{} }
    function saveCfg(){ localStorage.setItem('cfg', JSON.stringify(S.cfg)); }

    function initMap(){
      const center = S.cfg.defaultLatLon.split(',').map(Number);
      if (S.map) S.map.remove();
      S.map = L.map('map').setView(center, 13);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(S.map);
      if (S.youMarker) S.map.removeLayer(S.youMarker);
      S.youMarker = L.marker([center[0], center[1]], {title:'Tú aquí'}).addTo(S.map);
      clearAllRoutes();
    }

    function apiUrl(p){ return S.cfg.apiBase.replace(/\/$/,'') + p; }

    function clearMarkers(){
      if (S.startMarker) { S.map.removeLayer(S.startMarker); S.startMarker = null; }
      if (S.endMarker)   { S.map.removeLayer(S.endMarker);   S.endMarker   = null; }
    }
    function putMarkers(start, end){
      clearMarkers();
      if (start){
        S.startMarker = L.marker([start.lat, start.lon], {
          title: "Inicio",
          icon: L.icon({ iconUrl: "https://maps.gstatic.com/mapfiles/ms2/micons/blue-dot.png", iconSize:[32,32], iconAnchor:[16,32] })
        }).addTo(S.map).bindPopup("Inicio");
      }
      if (end){
        S.endMarker = L.marker([end.lat, end.lon], {
          title: "Fin",
          icon: L.icon({ iconUrl: "https://maps.gstatic.com/mapfiles/ms2/micons/red-dot.png", iconSize:[32,32], iconAnchor:[16,32] })
        }).addTo(S.map).bindPopup("Final");
      }
    }

    function clearAllRoutes(){
      S.variantLayers.forEach(v => S.map.removeLayer(v.layer));
      S.variantLayers = [];
      if (S.highlightLayer) { S.map.removeLayer(S.highlightLayer); S.highlightLayer = null; }
      S.highlightedRoute = null;
      clearMarkers();
      $('routeInfo').textContent = '';
    }

    function drawHighlight(geom){
      if (S.highlightLayer) S.map.removeLayer(S.highlightLayer);
      S.highlightLayer = L.geoJSON(geom, { style: { color: '#3388ff', weight: 6, opacity: 0.9 } }).addTo(S.map);
      const b = S.highlightLayer.getBounds();
      if (b.isValid()) S.map.fitBounds(b, { padding: [30,30] });
    }
    function drawVariant(geom, onClick){
      const layer = L.geoJSON(geom, { style: { color: '#888', weight: 3, opacity: 0.6 } }).addTo(S.map);
      layer.on('click', onClick);
      return layer;
    }

    function deriveEndpointsFromGeom(geom){
      try{
        const coords = (geom?.coordinates)||[];
        if (coords.length >= 2){
          const [sLon, sLat] = coords[0];
          const [eLon, eLat] = coords[coords.length-1];
          return { start:{ lat:sLat, lon:sLon }, end:{ lat:eLat, lon:eLon } };
        }
      }catch{}
      return { start:null, end:null };
    }

    async function generateOne(seed){
      const start = $('routeStart').value.split(',').map(Number);
      const km = parseFloat($('routeKm').value || '10');
      const hill = $('altPref').value;      // flat | mixed | hilly
      const surf = $('surfacePref').value;  // paved | unpaved

      const res = await fetch(apiUrl('/routes/generate'), {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({
          start:{ lat:start[0], lon:start[1] },
          distance_m: km*1000,
          hill_pref: hill,
          surface_pref: surf,
          seed
        })
      });
      const j = await res.json();
      if (!res.ok) throw new Error(j?.message || 'Error generando ruta');

      const geom = j.geom || null;
      let startPoint = j.start_point, endPoint = j.end_point;
      if ((!startPoint || !endPoint) && geom){
        const d = deriveEndpointsFromGeom(geom);
        startPoint = startPoint || d.start;
        endPoint   = endPoint   || d.end;
      }
      return { route_id: j.route_id, geom, start_point: startPoint, end_point: endPoint };
    }

    async function onGenerate1(){
      clearAllRoutes();
      try{
        const r = await generateOne(Math.floor(Math.random()*100000));
        S.highlightedRoute = r;
        drawHighlight(r.geom);
        putMarkers(r.start_point, r.end_point);
        $('routeInfo').textContent = `Ruta ${r.route_id} – destacada`;
      }catch(e){ alert('Error: ' + e.message); }
    }
    async function onGenerate5(){
      clearAllRoutes();
      const seeds = [1,2,3,4,5].map(s => s + Math.floor(Math.random()*10000));
      try{
        const results = await Promise.all(seeds.map(s => generateOne(s)));
        const highlighted = results[0];
        S.highlightedRoute = highlighted;
        drawHighlight(highlighted.geom);
        putMarkers(highlighted.start_point, highlighted.end_point);
        $('routeInfo').textContent = `Ruta ${highlighted.route_id} (azul). Haz clic en otra para destacar.`;

        results.slice(1).forEach(r => {
          const layer = drawVariant(r.geom, () => {
            S.highlightedRoute = r;
            drawHighlight(r.geom);
            putMarkers(r.start_point, r.end_point);
            $('routeInfo').textContent = `Ruta ${r.route_id} destacada.`;
          });
          S.variantLayers.push({ layer, ...r });
        });
      }catch(e){ alert('Error generando variantes: ' + e.message); }
    }

    async function onExport(){
      if (!S.highlightedRoute?.route_id) return alert('No hay ruta destacada. Genera primero.');
      const r = await fetch(apiUrl(`/routes/${S.highlightedRoute.route_id}/export`), { method:'POST' });
      const j = await r.json();
      if (j.url) window.open(j.url, '_blank'); else alert('No se pudo obtener el GPX');
    }

    // Geolocalización (centra y mantiene marcador)
    $('btnUseLoc').onclick = () => {
      navigator.geolocation.getCurrentPosition(p => {
        const s = `${p.coords.latitude.toFixed(5)},${p.coords.longitude.toFixed(5)}`;
        $('defaultLatLon').value = s;
        $('routeStart').value = s;
        S.cfg.defaultLatLon = s; saveCfg(); initMap();
      }, () => alert('No se pudo obtener ubicación'), { enableHighAccuracy:true, timeout:10000 });
      // seguimiento suave (opcional)
      navigator.geolocation.watchPosition(p => {
        const lat = p.coords.latitude, lon = p.coords.longitude;
        if (S.youMarker) { S.youMarker.setLatLng([lat,lon]); }
      }, null, { enableHighAccuracy:true });
    };

    $('btnSaveCfg').onclick = () => {
      S.cfg.apiBase = $('apiBase').value.trim();
      S.cfg.defaultLatLon = $('defaultLatLon').value.trim();
      saveCfg(); initMap();
      $('routeStart').value = S.cfg.defaultLatLon;
    };

    // init
    loadCfg();
    $('apiBase').value = S.cfg.apiBase;
    $('defaultLatLon').value = S.cfg.defaultLatLon;
    initMap();
    $('routeStart').value = S.cfg.defaultLatLon;

    // botones
    $('btnGen1').onclick  = onGenerate1;
    $('btnGen5').onclick  = onGenerate5;
    $('btnExport').onclick = onExport;
  </script>
</body>
</html>
